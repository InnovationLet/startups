title: "InnovationLet Startups"
short_title: "Startups"
tagline: "Funding, founders and the work of growing."
description: >-
  InnovationLet Startups covers funding, founders, go-to-market and the
  operational reality of scaling a company. Independent reporting and
  analysis from the InnovationLet editorial desk.
author: "InnovationLet Editorial"
email: "hello@innovationlet.com"

lang: "en"
locale: "en_US"

url: "https://innovationlet.github.io"
baseurl: "/startups"
main_site: "https://innovationlet.github.io"

category_name: "Startups"
category_meta: "Funding · Founders · Growth"
accent: "yellow"
hero_title: "Building companies, without the mythology."
hero_lead: >-
  Funding rounds, founder lessons and go-to-market, told with the
  numbers attached and the failures left in.

logo: "/favicon.svg"

twitter_username: "innovationlet"
github_username: "innovationlet"
linkedin_username: "innovationlet"

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: "feed.xml"

show_excerpts: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

defaults:
  - scope:
      path: ""
    values:
      image:
        path: "/assets/images/og-image.png"
        width: 1200
        height: 630
        alt: "InnovationLet — technology and innovation, decoded"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "InnovationLet Editorial"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "vendor"
